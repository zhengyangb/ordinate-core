<!doctype html>
<html lang="en" data-theme="auto" data-startup="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Ordinate</title>
    <link rel="preload" href="/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="startup-screen" class="page" role="status" aria-label="Opening Ordinate" aria-busy="true">
      <div class="app-window" aria-hidden="true">
        <div class="app-chrome">
          <div class="topbar startup-toolbar">
            <span class="brand-name">ordinate</span>
            <span class="startup-placeholder startup-title"></span>

          </div>
          <div class="startup-tabs">
            <span class="startup-placeholder"></span><span class="startup-placeholder"></span><span class="startup-placeholder"></span>
          </div>
        </div>
        <div class="startup-canvas">
          <div class="startup-table">
            <div class="startup-table-heading"></div>
            <div class="startup-table-row"></div><div class="startup-table-row"></div>
            <div class="startup-table-row"></div><div class="startup-table-row"></div>
            <div class="startup-table-row"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script type="module" src="/src/bootstrap.ts"></script>

</html>
